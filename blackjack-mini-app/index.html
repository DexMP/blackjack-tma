<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Mini App</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script> 
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Blackjack Multiplayer</h1>
        </header>

        <section id="multiplayer-area">
            <h2>Players at Table: <span id="table-id-display">N/A</span></h2>
            <div id="other-players-container">
                <!-- Player cards/info will be dynamically added here -->
            </div>
        </section>

        <section id="dealer-area">
            <h2>Dealer</h2>
            <div id="dealer-hand" class="hand-display">
                <!-- Dealer cards will be displayed here -->
            </div>
            <div id="dealer-score" class="score-display">Score: 0</div>
        </section>

        <section id="player-area"> 
            <h2>Your Hand (<span id="player-username-display">You</span>)</h2>
            <div id="player-hand" class="hand-display">
                <!-- Player cards will be displayed here -->
            </div>
            <div id="player-score" class="score-display">Score: 0</div>
        </section>

        <section id="game-info">
            <div id="game-messages">
                Connecting to server...
            </div>
        </section>

        <section id="betting-area">
            <label for="bet-amount">Bet Amount:</label>
            <input type="number" id="bet-amount" value="10" min="1">
            <button id="btn-place-bet">Place Bet</button> 
            <button id="btn-new-round">Start New Round</button> 
        </section>

        <section id="player-actions">
            <button id="btn-hit">Hit</button>
            <button id="btn-stand">Stand</button>
        </section>

        <section id="balance-area">
            <h2>Balance</h2>
            <p>Your current balance: <span id="player-balance">100</span> Stars</p>
            <div>
                <label for="topup-amount">Top-up Amount (Stars):</label>
                <input type="number" id="topup-amount" name="topup-amount" min="1" value="10">
                <button id="btn-topup">Top-up with Stars</button>
            </div>
        </section>
        
        <footer>
            <p>Blackjack Mini App for Telegram</p>
        </footer>
    </div>

    <script src="js/blackjack.js"></script> 
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
